<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://xmlns.jcp.org/jsf/passthrough">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Iniciar sesión - Sistema de Solicitud de Permisos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Public+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="#{request.contextPath}/css/login.css"/>
</h:head>

<h:body styleClass="login-page">
    <div class="login-pantalla">
        <div class="login-tarjeta">
            <div class="login-marca">
                <div class="marca-logo-fila">
                    <img src="#{request.contextPath}/img/logo.png" alt="Invercalma"/>
                </div>
                <h1 class="marca-titulo">Sistema de Solicitud de Permisos</h1>
                <p class="marca-descripcion">Gestiona tus solicitudes.</p>
            </div>

            <div class="login-formulario-panel">
                <div class="login-formulario">
                    <h2>Bienvenido</h2>
                    <p class="subtitulo">Ingresa con tu usuario y contraseña.</p>

                    <h:panelGroup layout="block" styleClass="mensaje-error" rendered="#{loginBean.hayError}">
                        #{loginBean.error}
                    </h:panelGroup>

                    <h:form id="formLogin">
                        <h:outputLabel for="username" value="Usuario"/>
                        <h:inputText id="username" value="#{loginBean.username}" p:autofocus="autofocus" p:autocomplete="username"/>

                        <h:outputLabel for="password" value="Contraseña"/>
                        <h:inputSecret id="password" value="#{loginBean.password}" p:autocomplete="current-password"/>

                        <h:commandButton id="ingresar" value="Ingresar" action="#{loginBean.ingresar}" styleClass="login-boton"/>
                    </h:form>

                    <div class="login-divisor"></div>
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
