<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://xmlns.jcp.org/jsf/passthrough">

<ui:composition template="/WEB-INF/templates/template.xhtml">
    <ui:param name="activo" value="solicitudes"/>

    <ui:define name="contenido">
        <div class="rh-estrecho">

            <div>
                <h:link outcome="solicitudes" styleClass="rh-volver">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b3470a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
                    Volver a mis solicitudes
                </h:link>
                <h1 class="rh-titulo">Registrar incapacidad</h1>
            </div>

            <h:messages globalOnly="true" layout="list" errorClass="rh-msg rh-msg-error" infoClass="rh-msg rh-msg-ok"/>

            <section class="rh-col-form rh-form-ancho">
                <h:form id="formIncapacidad" styleClass="rh-form rh-form-grande">

                    <label class="rh-campo">Número de documento (ISSS)
                        <h:inputText id="documento" value="#{incapacidadBean.numeroDocumento}" p:maxlength="100" p:placeholder="Ej. 123456456"/>
                    </label>

                    <div class="rh-fila-fechas">
                        <label class="rh-campo">Fecha inicio
                            <h:inputText id="inicio" value="#{incapacidadBean.fechaInicio}" p:type="date"/>
                        </label>
                        <label class="rh-campo">Fecha fin
                            <h:inputText id="fin" value="#{incapacidadBean.fechaFin}" p:type="date"/>
                        </label>
                    </div>

                    <label class="rh-campo">Observaciones <span class="rh-opcional">(opcional)</span>
                        <h:inputTextarea id="observaciones" value="#{incapacidadBean.observaciones}" rows="3" p:maxlength="500"
                                         p:placeholder="Detalle adicional"/>
                    </label>

                    <div class="rh-dropzone">
                        <div class="rh-dropzone-ico">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5b6475" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
                        </div>
                        <div class="rh-dropzone-texto">
                            <div class="rh-dropzone-titulo">Documento del ISSS (PDF)</div>
                            <div class="rh-dropzone-sub">La carga del archivo se habilitará más adelante. Por ahora solo se registra el número.</div>
                        </div>
                        <span class="rh-pronto">Próximamente</span>
                    </div>

                    <div class="rh-acciones">
                        <h:link outcome="solicitudes" value="Cancelar" styleClass="rh-btn-cancelar"/>
                        <h:commandButton id="registrar" value="Registrar incapacidad" action="#{incapacidadBean.registrar}" styleClass="rh-btn-enviar rh-btn-ancho"/>
                    </div>
                </h:form>
            </section>

        </div>
    </ui:define>
</ui:composition>
</html>
