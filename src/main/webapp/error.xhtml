<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Ocurrió un error - Sistema de Solicitud de Permisos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Public+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="#{request.contextPath}/css/login.css"/>
</h:head>

<h:body styleClass="login-page">
    <div class="login-pantalla">
        <div class="aviso-tarjeta">
            <div class="aviso-logo">
                <img src="#{request.contextPath}/img/logo.png" alt="Invercalma"/>
            </div>
            <h1>Ocurrió un error</h1>
            <p>La página que buscas no existe o algo salió mal. Puedes volver al inicio e intentarlo de nuevo.</p>
            <a class="login-boton aviso-boton" href="#{request.contextPath}/login">Volver al inicio</a>
        </div>
    </div>
</h:body>
</html>
